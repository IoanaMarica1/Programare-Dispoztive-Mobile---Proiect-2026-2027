spring.config.import=optional:file:./secrets.properties,optional:file:./backend/secrets.properties

spring.application.name=backend

spring.datasource.url=jdbc:postgresql://localhost:5434/wanderly_db
# spring.datasource.username / password come from secrets.properties.
spring.docker.compose.lifecycle-management=start-only
# Schema is owned by Flyway (db/migration); Hibernate only checks it matches the entities.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
# Services return DTOs built inside their own transactions, so no session is needed in the web layer.
# Keeping it open would hold a DB connection for the whole request, e.g. during slow AI calls.
spring.jpa.open-in-view=false

# jwt.secret comes from secrets.properties.
jwt.expiration-ms=604800000


# Avatar uploads
app.upload-dir=uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
