services:
  db:
    image: postgres:17
    container_name: wanderly-db
    restart: unless-stopped
    env_file: .env
    ports:
      # Only reachable from this computer, not from the rest of the network.
      - "127.0.0.1:5434:5432"
    volumes:
      - wanderly-data:/var/lib/postgresql/data

volumes:
  wanderly-data: